version: '3'
services:
  backend:
    container_name: backendContainer
    build: ./backend   
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
     
  frontend:
    container_name: frontendContainer
    build: ./frontend    
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
     
