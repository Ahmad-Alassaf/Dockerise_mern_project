version: '3'
services:
  backend:
    container_name: backendContainer
   
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    env_file:
      - ./.env
     
  frontend:
    container_name: frontendContainer
     
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
  
  mongo:
    image: mongo
    
    restart: always
    volumes:
      - mongo-db:/data/db
    env_file:
      - ./.env
volumes:
  mongo-db: