version: '3'
services:
  backend:
    build:
      context: ./backend
      args:
        - NODE_ENV=development
    volumes:
      - ./backend:/backend:ro     
    environment:      
      - NODE_ENV=development
    command: npm run server-dev
  frontend:
    build:
      context: ./frontend      
      args:
        - NODE_ENV=development
    environment:      
      - NODE_ENV=development
